name: Build Pinned Stage Production Artifact

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: |
          npm run lint
          npm test

      - name: Build production bundle
        run: npm run build

      - name: Upload immutable dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: nox-motion-arsenal-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1
