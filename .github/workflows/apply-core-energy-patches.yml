name: Apply Core And Energy Patches

on:
  push:
    branches:
      - agent/core-variants-energy-overdrive

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/core-variants-energy-overdrive
          fetch-depth: 0

      - name: Wire product cores and energy variants
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          pinned = Path('src/motion-arsenal/effects/scroll/PinnedProductStageVariants.tsx')
          text = pinned.read_text()
          old_import = "import { glyphPath } from '../../lib/svgUtils';\n"
          new_import = old_import + "import { ProductStageCore } from './ProductStageCore';\n"
          if "import { ProductStageCore }" not in text:
              assert old_import in text
              text = text.replace(old_import, new_import, 1)

          old_root = '    <div ref={rootRef} className="pps-root" onPointerMove={handlePointerMove} style={stageVars}>'
          new_root = '    <div ref={rootRef} className="pps-root" data-product-variant={selectedVariant} onPointerMove={handlePointerMove} style={stageVars}>'
          assert old_root in text or new_root in text
          text = text.replace(old_root, new_root, 1)

          old_core = '''                  <div className="pps-core">
                    <svg viewBox="0 0 120 120">
                      <path d={glyph} fill="none" strokeWidth="2.5" strokeLinecap="round" />
                    </svg>
                  </div>'''
          new_core = '''                  <ProductStageCore variant={selectedVariant} glyph={glyph} />'''
          assert old_core in text or new_core in text
          text = text.replace(old_core, new_core, 1)
          pinned.write_text(text)

          scroll_catalog = Path('src/motion-arsenal/effects/scroll/catalog.ts')
          text = scroll_catalog.read_text()
          text = text.replace(
              "        'PinnedProductStageVariants.tsx (NOX preset registry)',\n",
              "        'PinnedProductStageVariants.tsx (NOX preset registry)',\n        'ProductStageCore.tsx (five semantic product artifacts)',\n",
          )
          text = text.replace(
              "      description: 'Referenzierbares Produkt-Story-System mit fünf fertigen NOX-Presets. Jede Variante besitzt eigene Kapitel, Module, Kennzahlen, CTA und eine stabile Agenten-Referenz für den späteren Einbau in NOX- oder Kundenwebseiten.',",
              "      description: 'Referenzierbares Produkt-Story-System mit fünf fertigen NOX-Presets. Jede Variante besitzt eigene Kapitel, Module, Kennzahlen, CTA, eine stabile Agenten-Referenz und ein sichtbar unterschiedliches semantisches Core-Artefakt statt eines generischen Symbols.',",
          )
          text = text.replace(
              "      technicalBasis: 'Sticky scroll timeline + CSS-3D layers + deterministic glyph + exported preset registry + public agent manifest.',",
              "      technicalBasis: 'Sticky scroll timeline + CSS-3D layers + five semantic SVG/CSS core artifacts + exported preset registry + public agent manifest.',",
          )
          scroll_catalog.write_text(text)

          forge_catalog = Path('src/motion-arsenal/effects/forge-skilltree/catalog.ts')
          text = forge_catalog.read_text()
          start_marker = "  {\n    meta: {\n      id: 'skilltree-svg-energy-lines',"
          end_marker = "    Component: lazy(() => import('./SvgEnergyLinesFlow')),\n  },"
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          replacement = '''  {
    meta: {
      id: 'skilltree-svg-energy-lines',
      name: 'SvgEnergyLinesFlow',
      displayName: 'Particle Energy Flow System',
      category: 'forge-skilltree',
      sourceWebsite: 'nox-original',
      sourceFiles: [
        'NOX Forge Design-Lab (dl-link--flow)',
        'SvgEnergyLinesFlow.tsx (SVG animateMotion particle network)',
        'public/agent-manifests/svg-energy-lines-variants.json',
      ],
      mode: 'nox-adapted',
      complexity: 'high',
      dependencies: [],
      bestFor: ['Skilltree-Netzwerke', 'Agenten-Routing', 'Daten- und Partikelströme', 'Produktaktivierung'],
      performanceNotes: 'Ein SVG-Netz mit maximal 96 animateMotion-Partikeln, transform-/stroke-basierter Animation und einem gemeinsamen Glow-Filter. Keine Canvas- oder WebGL-Runtime.',
      mobileNotes: 'ViewBox skaliert vollständig; Style- und Intensitätswähler sind horizontal scrollbar. Partikelzahl kann für kleine Geräte reduziert werden.',
      reducedMotionNotes: 'Partikel und Loop-Animationen werden deaktiviert; Netzwerk, Nodes, Richtung und Farbstil bleiben statisch lesbar.',
      description: 'Vollwertiges Energiefluss-System: Partikel reisen entlang verzweigter SVG-Pfade, helle Flow-Heads ziehen Leuchtspuren, Ziel-Nodes laden sich bei Ankunft auf und der zentrale Kernel pulsiert. Fünf stabile Styles, drei Intensitäten und drei Flussrichtungen sind direkt auswählbar und per Agenten-Referenz wiederverwendbar.',
      currentUsage: ['NOX Forge Skilltree', 'Agenten-Routing-Visualisierung', 'System-Activation-Heroes'],
      technicalBasis: 'Deterministic SVG path graph + animateMotion particles + moving dash heads + node charge rings + shared agent manifest.',
      importPath: '@/motion-arsenal/effects/forge-skilltree/SvgEnergyLinesFlow',
      usageJsx: '<SvgEnergyLinesFlow styleVariant="forge-ember-flow" intensityPreset="active" directionMode="outward" showStyleSwitcher />',
      props: [
        {
          key: 'styleVariant',
          label: 'Energy Style',
          type: 'select',
          default: 'forge-ember-flow',
          options: ['forge-ember-flow', 'plasma-signal-stream', 'gold-command-current', 'ghost-wire-pulse', 'overdrive-storm'],
          group: 'Style',
        },
        {
          key: 'intensityPreset',
          label: 'Intensity',
          type: 'select',
          default: 'active',
          options: ['calm', 'active', 'overdrive'],
          group: 'Style',
        },
        {
          key: 'directionMode',
          label: 'Direction',
          type: 'select',
          default: 'outward',
          options: ['inward', 'outward', 'bidirectional'],
          group: 'Flow',
        },
        { key: 'particleCount', label: 'Particles', type: 'range', default: 42, min: 8, max: 96, step: 2, group: 'Flow' },
        { key: 'flowSpeed', label: 'Flow Speed', type: 'range', default: 1, min: 0.3, max: 3, step: 0.1, group: 'Flow' },
        { key: 'trailLength', label: 'Trail Length', type: 'range', default: 0.55, min: 0.1, max: 1, step: 0.05, group: 'Flow' },
        { key: 'branchActivity', label: 'Branch Activity', type: 'range', default: 1, min: 0, max: 1, step: 0.1, group: 'Network' },
        { key: 'glowStrength', label: 'Glow', type: 'range', default: 0.9, min: 0.2, max: 1.5, step: 0.1, group: 'Network' },
        { key: 'nodePulseStrength', label: 'Node Charge', type: 'range', default: 1, min: 0.3, max: 2, step: 0.1, group: 'Network' },
        { key: 'showStyleSwitcher', label: 'Show Style Switcher', type: 'boolean', default: true, group: 'Style' },
      ],
      productionSafe: true,
      status: 'candidate',
      fullBleed: true,
    },
    Component: lazy(() => import('./SvgEnergyLinesFlow')),
  },'''
          text = text[:start] + replacement + text[end:]
          forge_catalog.write_text(text)

          manifest_path = Path('public/agent-manifests/pinned-product-stage-variants.json')
          manifest = json.loads(manifest_path.read_text())
          core_types = {
              'nox-global-sales-os': 'revenue-reactor-core',
              'project-x-command-center': 'agent-nexus-core',
              'ai-growth-engine': 'signal-growth-nucleus',
              'conversion-website-system': 'conversion-prism',
              'automation-ops-system': 'automation-kernel',
          }
          for variant in manifest['variants']:
              variant['coreArtifact'] = core_types[variant['id']]
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')

          workflow = Path('.github/workflows/apply-core-energy-patches.yml')
          workflow.unlink()
          PY

      - name: Commit wired effects
        run: |
          git config user.name "NOX Arsenal Agent"
          git config user.email "168745164+Finitolombardo@users.noreply.github.com"
          git add -A
          git commit -m "feat: wire semantic product cores and particle energy flow"
          git push origin HEAD:agent/core-variants-energy-overdrive
