name: Recovery Self-Contained Build

on:
  push:
    branches:
      - recovery/self-contained-production-build
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: 22.20.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate
        run: |
          npm run lint
          npm test
          npm run build

      - name: Upload production dist
        uses: actions/upload-artifact@v4
        with:
          name: nox-motion-arsenal-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1
