name: Apply Forge Glyph Overdrive

on:
  push:
    branches:
      - agent/forge-energy-glyphs-overdrive

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/forge-energy-glyphs-overdrive
          fetch-depth: 0
      - name: Apply implementation payload
        shell: bash
        run: |
          cat > /tmp/forge-glyphs-patch.b64 <<'PAYLOAD'
[... ELLIPSIZATION ...]
PAYLOAD
          base64 -d /tmp/forge-glyphs-patch.b64 > /tmp/forge-glyphs-patch.tar.gz
          tar -xzf /tmp/forge-glyphs-patch.tar.gz -C "$GITHUB_WORKSPACE"
          rm -f .github/workflows/forge-glyphs-source-artifact.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json public/agent-manifests/forge-energy-glyphs-variants.json scripts/test-forge-energy-glyphs-contract.mjs src/motion-arsenal/effects/backgrounds/ForgeEnergyGlyphs.tsx src/motion-arsenal/effects/backgrounds/catalog.ts .github/workflows/forge-glyphs-source-artifact.yml
          git commit -m "feat: overdrive forge energy glyph system"
          git push origin HEAD:agent/forge-energy-glyphs-overdrive
